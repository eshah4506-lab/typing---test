<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpeedType</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#323437;
  color:#d1d0c5;
  font-family:Arial,sans-serif;
}

.container{
  max-width:950px;
  margin:auto;
  padding:25px 18px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#e2b714;
}

.settingsBtn{
  background:#2c2e31;
  color:#d1d0c5;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-size:18px;
}

.settings{
  display:none;
  background:#2c2e31;
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
}

.settings h3{
  margin-top:0;
  color:#e2b714;
}

.settingRow{
  margin:15px 0;
}

.settingRow label{
  display:block;
  margin-bottom:8px;
  color:#aaa;
}

textarea,
input[type="number"]{
  width:100%;
  background:#191b1d;
  color:#fff;
  border:1px solid #555;
  border-radius:8px;
  padding:12px;
  font-size:16px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

select{
  width:100%;
  padding:12px;
  border-radius:8px;
  background:#191b1d;
  color:white;
  border:1px solid #555;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:10px;
}

.checkbox input{
  width:20px;
  height:20px;
}

.apply{
  background:#e2b714;
  color:#323437;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  font-weight:bold;
}

.timer{
  text-align:center;
  font-size:22px;
  color:#e2b714;
  margin-bottom:20px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:55px;
  margin-bottom:30px;
}

.stat{
  text-align:center;
}

.stat span{
  display:block;
  color:#777;
  font-size:15px;
  margin-bottom:5px;
}

.stat strong{
  font-size:28px;
  color:#e2b714;
}

.words{
  background:#2c2e31;
  border-radius:12px;
  padding:25px;
  min-height:180px;
  line-height:1.8;
  margin-bottom:20px;
  overflow-wrap:break-word;
}

.words span.correct{
  color:#d1d0c5;
}

.words span.wrong{
  color:#ca4754;
  text-decoration:underline;
}

.words span.current{
  border-bottom:2px solid #e2b714;
}

#input{
  width:100%;
  height:130px;
  background:#191b1d;
  color:white;
  border:2px solid #444;
  border-radius:10px;
  padding:15px;
  outline:none;
  resize:none;
}

#input:focus{
  border-color:#e2b714;
}

.restart{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:0;
  border-radius:8px;
  background:#e2b714;
  color:#323437;
  font-size:17px;
  font-weight:bold;
}

.message{
  text-align:center;
  color:#777;
}

.result{
  display:none;
  background:#2c2e31;
  padding:25px;
  border-radius:12px;
  text-align:center;
  margin-top:20px;
}

.result h2{
  color:#e2b714;
}

@media(max-width:600px){

  .stats{
    gap:30px;
  }

  .stat strong{
    font-size:25px;
  }

  .words{
    padding:20px;
  }

}

</style>
</head>

<body>

<div class="container">

<header>

<div class="logo">⚡ SpeedType</div>

<button class="settingsBtn" onclick="toggleSettings()">
⚙️ Settings
</button>

</header>


<!-- SETTINGS -->

<div class="settings" id="settings">

<h3>Typing Settings</h3>


<div class="settingRow">

<label>Words / Text</label>

<textarea id="customText">The quick brown fox jumps over the lazy dog. Technology makes our life easier and faster. Practice typing every day to improve your speed and accuracy.</textarea>

</div>


<div class="settingRow">

<label>Font Size</label>

<select id="fontSize">

<option value="20">20px</option>
<option value="22">22px</option>
<option value="24" selected>24px</option>
<option value="26">26px</option>
<option value="28">28px</option>
<option value="32">32px</option>
<option value="36">36px</option>

</select>

</div>


<div class="settingRow">

<label>Font Colour</label>

<input type="color" id="fontColor" value="#d1d0c5">

</div>


<div class="settingRow">

<label>Background Colour</label>

<input type="color" id="backgroundColor" value="#2c2e31">

</div>


<div class="settingRow checkbox">

<input type="checkbox" id="timerEnabled">

<label>Enable Timer</label>

</div>


<div class="settingRow">

<label>Timer Seconds</label>

<select id="timerSeconds">

<option value="15">15 Seconds</option>
<option value="30" selected>30 Seconds</option>
<option value="60">60 Seconds</option>
<option value="120">120 Seconds</option>

</select>

</div>


<button class="apply" onclick="applySettings()">
Apply Settings
</button>

</div>


<div class="timer" id="timer" style="display:none">
30s
</div>


<div class="stats">

<div class="stat">
<span>WPM</span>
<strong id="wpm">0</strong>
</div>

<div class="stat">
<span>Accuracy</span>
<strong id="accuracy">100%</strong>
</div>

<div class="stat">
<span>Characters</span>
<strong id="characters">0</strong>
</div>

</div>


<div class="words" id="words"></div>


<textarea
id="input"
placeholder="Click here and start typing..."
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false">
</textarea>


<button class="restart" onclick="restart()">
↻ Restart
</button>


<div class="message">
Type the text above. Press Restart to begin again.
</div>


<div class="result" id="result">

<h2>Test Complete!</h2>

<p>
Speed:
<b id="finalWpm">0</b> WPM
</p>

<p>
Accuracy:
<b id="finalAccuracy">100%</b>
</p>

<button class="restart" onclick="restart()">
Try Again
</button>

</div>

</div>


<script>

const wordsBox =
document.getElementById("words");

const input =
document.getElementById("input");

const timerBox =
document.getElementById("timer");

let targetText = "";

let typedText = "";

let timer = null;

let started = false;

let finished = false;

let timeLeft = 30;

let timerEnabled = false;

let selectedTime = 30;

let startTime = null;


/* SETTINGS */

function toggleSettings(){

const box =
document.getElementById("settings");

box.style.display =
box.style.display === "block"
? "none"
: "block";

}


function applySettings(){

const text =
document.getElementById("customText").value.trim();

const size =
document.getElementById("fontSize").value;

const color =
document.getElementById("fontColor").value;

const background =
document.getElementById("backgroundColor").value;

timerEnabled =
document.getElementById("timerEnabled").checked;

selectedTime =
parseInt(
document.getElementById("timerSeconds").value
);


if(text.length > 0){

targetText = text;

}


wordsBox.style.fontSize =
size + "px";

wordsBox.style.color =
color;

wordsBox.style.background =
background;


if(timerEnabled){

timerBox.style.display = "block";

}else{

timerBox.style.display = "none";

}


restart();

document.getElementById("settings")
.style.display = "none";

}


/* CREATE TEXT */

function createText(){

wordsBox.innerHTML = "";

for(let i=0;i<targetText.length;i++){

const span =
document.createElement("span");

span.textContent =
targetText[i];

wordsBox.appendChild(span);

}

highlightCurrent();

}


/* HIGHLIGHT */

function highlightCurrent(){

const spans =
wordsBox.querySelectorAll("span");

spans.forEach(function(span){

span.classList.remove("current");

});


if(spans[typedText.length]){

spans[typedText.length]
.classList.add("current");

}

}


/* INPUT */

input.addEventListener("input",function(){

if(finished){
return;
}


if(!started){

started = true;

startTime = Date.now();

if(timerEnabled){

startTimer();

}

}


typedText =
input.value;

showCharacters();

calculate();

highlightCurrent();


/* SIMPLE MODE */

if(
typedText.length >= targetText.length
){

if(!timerEnabled){

finish();

}

}

});


/* TIMER */

function startTimer(){

clearInterval(timer);

timer =
setInterval(function(){

timeLeft--;

timerBox.textContent =
timeLeft + "s";

calculate();


if(timeLeft <= 0){

finish();

}

},1000);

}


/* COLOURS */

function showCharacters(){

const spans =
wordsBox.querySelectorAll("span");


for(let i=0;i<spans.length;i++){

spans[i]
.classList.remove("correct");

spans[i]
.classList.remove("wrong");


if(i < typedText.length){

if(
typedText[i] === targetText[i]
){

spans[i]
.classList.add("correct");

}else{

spans[i]
.classList.add("wrong");

}

}

}

}


/* CALCULATE */

function calculate(){

const typed =
input.value;


document.getElementById("characters")
.textContent =
typed.length;


let correct = 0;


for(
let i=0;
i<typed.length;
i++
){

if(
typed[i] === targetText[i]
){

correct++;

}

}


let accuracy =
typed.length > 0
? Math.round(
(correct / typed.length) * 100
)
: 100;


document.getElementById("accuracy")
.textContent =
accuracy + "%";


let elapsed;


if(timerEnabled){

elapsed =
selectedTime - timeLeft;

}else{

elapsed =
(Date.now() - startTime) / 1000;

}


if(elapsed > 0){

let words =
correct / 5;

let wpm =
Math.round(
words / (elapsed / 60)
);


document.getElementById("wpm")
.textContent =
wpm;

}

}


/* FINISH */

function finish(){

if(finished){
return;
}


finished = true;

clearInterval(timer);

input.disabled = true;

calculate();


document.getElementById("finalWpm")
.textContent =
document.getElementById("wpm")
.textContent;


document.getElementById("finalAccuracy")
.textContent =
document.getElementById("accuracy")
.textContent;


document.getElementById("result")
.style.display = "block";

}


/* RESTART */

function restart(){

clearInterval(timer);

started = false;

finished = false;

typedText = "";

input.disabled = false;

input.value = "";

timeLeft = selectedTime;


document.getElementById("wpm")
.textContent = "0";

document.getElementById("accuracy")
.textContent = "100%";

document.getElementById("characters")
.textContent = "0";


document.getElementById("result")
.style.display = "none";


if(timerEnabled){

timerBox.style.display = "block";

timerBox.textContent =
selectedTime + "s";

}else{

timerBox.style.display = "none";

}


createText();

input.focus();

}


/* DEFAULT */

targetText =
document.getElementById("customText")
.value.trim();

createText();

</script>

</body>
</html>
